name: Publish a tested build

# Publishes the packages of an earlier Build & Release run that built and
# passed every install test, without building again — for when only the
# publish step itself needs another go.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build & Release run whose packages to publish'
        required: true

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist-all
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Flatten into dist/
        run: |
          mkdir -p dist
          find dist-all -type f -exec cp -n {} dist/ \;
          ls -la dist
      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/publish-release.js
