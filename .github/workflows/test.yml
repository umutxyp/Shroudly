name: Tests

# Every push and pull request: the engine, encrypted DNS, Discord app mode, games
# and apps mode (the real Roblox installer on Windows) and the uninstaller hook,
# on real Windows, Linux and macOS machines, x64 and ARM.
# The network tests talk to real resolvers and Discord's update servers, so
# they also catch the outside world changing under us.

on:
  push:
    # site-list holds data only; Dependabot's branches are tested once, as
    # pull requests, not a second time on push.
    branches: ['**', '!site-list', '!dependabot/**']
  pull_request: {}
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: 'Also measure this ref (a tag such as v2.5.2) for a before/after memory comparison'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install dependencies
        run: npm ci

      - name: Build engine (this machine)
        run: node scripts/build-core.js

      # The Advanced (packet-layer) engine is otherwise only built at release.
      - name: Build the Advanced engine (Linux x64, Windows x64)
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'windows-latest'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then node scripts/build-core-advanced.js --target win32-x64; else bash scripts/ci-linux-advanced.sh amd64; fi

      # The Linux Advanced engine on a real packet path: network namespaces, a
      # router with a per-packet filter, NFQUEUE (tests/lab/advanced-lab.sh).
      - name: Advanced mode lab (Linux, real packets)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo env "PATH=$PATH" bash tests/lab/advanced-lab.sh electron/tools/core/linux-x64/shroudly-core-adv

      # The default engine on the kinds of networks people report from, on a
      # real packet path: DPI that drops or resets on the name, addresses
      # blocked outright with the network's DNS knowing another (or the same,
      # or slowly), a name nobody filters (tests/lab/censor-lab.sh).
      - name: Censor lab (Linux, real packets)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo env "PATH=$PATH" bash tests/lab/censor-lab.sh electron/tools/core/linux-x64/shroudly-core

      # The Windows Advanced engine on the real packet path (WinDivert; the
      # runner is Administrator): pages still load in full while it changes
      # every first request, and it stops cleanly (tests/lab/advanced-windows.js).
      - name: Advanced mode lab (Windows, real packets)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          node scripts/fetch-windivert.js
          node tests/lab/advanced-windows.js electron/tools/core/win32-x64/shroudly-core-adv.exe

      # Microsoft Store apps and the loopback proxy (issue #26): a process in
      # an app container of our own reaches the internet but not 127.0.0.1
      # nor the engine's SOCKS port until it has a loopback exemption, and
      # does with one; Shroudly's autopilot adds the exemptions, remembers
      # only its own, and the switch and the uninstaller take out only those
      # (tests/lab/uwp-loopback.js). It changes the runner's exemptions.
      - name: Store apps lab (Windows, app containers and loopback)
        if: runner.os == 'Windows'
        run: node tests/lab/uwp-loopback.js

      # The system proxy against WinINET's own saves (another program setting
      # a proxy option, Windows on a network change): Shroudly's PAC is kept,
      # nothing looks taken over, and after Stop a save brings nothing of
      # ours back (tests/lab/wininet-save.js). It changes this user's proxy
      # setting and puts it back.
      - name: WinINET lab (Windows, the system proxy against WinINET's saves)
        if: runner.os == 'Windows'
        run: node tests/lab/wininet-save.js

      - name: Engine unit tests, sanitizers, fuzzing
        if: runner.os != 'Windows'
        working-directory: core
        run: |
          make test
          make test-asan
          make fuzz

      - name: Translations
        run: npm run check:translations

      - name: Network tests
        run: npm run test:net

      # The same engine tests again on a build with AddressSanitizer and
      # UndefinedBehaviorSanitizer, so a memory error fails the run: every
      # engine-* test that starts the engine itself (engine-manager runs the
      # app's own build, so it is not one of them; a new engine-* test belongs
      # in this list). Linux is the only platform with the decoy technique.
      - name: Network tests on a sanitizer build (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cc -std=c11 -g -O1 -D_GNU_SOURCE -D_DARWIN_C_SOURCE -fsanitize=address,undefined -fno-omit-frame-pointer -pthread -o "$RUNNER_TEMP/core-asan" core/src/*.c
          SHROUDLY_ENGINE="$RUNNER_TEMP/core-asan" node tests/net/run.js \
            engine-cut engine-dial engine-family engine-hostile engine-late-reset engine-outage \
            engine-resume engine-silent engine-site engine-slowpath engine-socks4 \
            discord doh watchdog

  # The engine built with each distribution's own compiler and C library,
  # and the network tests run there.
  distros:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: 'archlinux:latest', setup: 'pacman -Syu --noconfirm gcc make nodejs' }
          - { image: 'fedora:latest',    setup: 'dnf install -y gcc make nodejs' }
          - { image: 'debian:stable',    setup: 'apt-get update -qq && apt-get install -y gcc make nodejs ca-certificates' }
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
      - name: Tools (${{ matrix.image }})
        run: ${{ matrix.setup }}
      - name: Build and test the engine
        run: |
          node --version
          node scripts/build-core.js
          cd core && make test
      - name: Network tests
        run: node tests/net/run.js

  # The real app, end to end (tests/e2e): started into the tray, its window
  # opened, left idle, sent to the tray, protection on, logoff (Windows), quit;
  # and what each of those states costs in memory on this OS.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Display and libraries for Electron (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb dbus-x11 libnss3 libgbm1 libasound2t64 libgtk-3-0t64

      - name: Install, build the engine and the interface
        run: |
          npm ci
          node scripts/build-core.js
          npm run build

      - name: End-to-end
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then dbus-run-session -- xvfb-run -a node tests/e2e/app.test.js
          else node tests/e2e/app.test.js; fi

      # Real browsers and the system's own HTTP clients, through the PAC that
      # Shroudly puts in this machine's proxy setting.
      - name: Browsers through the system proxy
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get install -y -qq dconf-cli dconf-gsettings-backend gsettings-desktop-schemas >/dev/null
            dbus-run-session -- node tests/e2e/browsers.test.js
          else node tests/e2e/browsers.test.js; fi

      - name: Baseline for comparison (${{ inputs.baseline_ref }})
        if: inputs.baseline_ref != ''
        shell: bash
        run: |
          git fetch --depth=1 origin "refs/tags/${{ inputs.baseline_ref }}:refs/tags/${{ inputs.baseline_ref }}" || git fetch --depth=1 origin "${{ inputs.baseline_ref }}"
          git worktree add "$RUNNER_TEMP/baseline" "${{ inputs.baseline_ref }}"
          (cd "$RUNNER_TEMP/baseline" && npm ci && node scripts/build-core.js && npm run build)
          export SHROUDLY_APP_DIR="$RUNNER_TEMP/baseline"
          if [ "$RUNNER_OS" = Linux ]; then dbus-run-session -- xvfb-run -a node tests/e2e/app.test.js
          else node tests/e2e/app.test.js; fi

      - name: Screenshots and memory report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.os }}
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

  # The Android app: hev-socks5-tunnel from its pinned, verified source, unit
  # tests, lint, the debug and release builds (Gradle builds the engine from
  # core/ for every Android ABI, run inside the app's process), the Google
  # Play bundle, Play's 16 KB page size check on all of them, and the app on a
  # real Android system (an x86_64 emulator with KVM): protection on, names,
  # HTTP and UDP through the VPN and the engine, the engine and the tunnel
  # stopping under it, Private DNS by name, network changes, the app's own
  # network cut (protection must end, not leave the phone offline), then off
  # (android/scripts/emulator-smoke.sh).
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Gradle wrapper is the one published by Gradle
        run: echo "7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d  android/gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION" \
            emulator platform-tools "system-images;android-35;google_apis;x86_64" >/dev/null
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: hev source, generated files
        run: |
          node android/scripts/fetch-hev.js
          node android/scripts/gen-strings.js --check
          node android/scripts/gen-block-ips.js --check
          node android/scripts/gen-raw-apps.js --check
      - name: Unit tests, lint, debug and release builds
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: The Google Play bundle (STORE_BUILD)
        working-directory: android
        run: ./gradlew --no-daemon -Pshroudly.store=play bundleRelease
      - name: 16 KB page size (APKs, and the APKs Play makes from the bundle)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          bash android/scripts/check-16k.sh android/app/build/outputs/apk/debug/app-debug.apk \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            android/app/build/outputs/bundle/release/app-release.aab
      - name: The app on an Android emulator (x86_64, API 35)
        run: bash android/scripts/emulator-smoke.sh --abi x86_64 --api 35
