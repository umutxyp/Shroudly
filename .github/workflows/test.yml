name: Tests

# Every push and pull request: the engine, encrypted DNS, Discord app mode, games
# and apps mode (the real Roblox installer on Windows) and the uninstaller hook,
# on real Windows, Linux and macOS machines, x64 and ARM.
# The network tests talk to real resolvers and Discord's update servers, so
# they also catch the outside world changing under us.

on:
  push:
    branches: ['**', '!site-list']   # site-list holds data only
  pull_request: {}
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: 'Also measure this ref (a tag such as v2.5.2) for a before/after memory comparison'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install dependencies
        run: npm ci

      - name: Build engine (this machine)
        run: node scripts/build-core.js

      - name: Engine unit tests, sanitizers, fuzzing
        if: runner.os != 'Windows'
        working-directory: core
        run: |
          make test
          make test-asan
          make fuzz

      - name: Translations
        run: npm run check:translations

      - name: Network tests
        run: npm run test:net

      # The same engine tests again on a build with AddressSanitizer and
      # UndefinedBehaviorSanitizer, so a memory error fails the run.
      - name: Network tests on a sanitizer build (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cc -std=c11 -g -O1 -D_GNU_SOURCE -D_DARWIN_C_SOURCE -fsanitize=address,undefined -fno-omit-frame-pointer -pthread -o "$RUNNER_TEMP/core-asan" core/src/*.c
          SHROUDLY_ENGINE="$RUNNER_TEMP/core-asan" node tests/net/run.js engine-cut engine-hostile discord doh watchdog

  # The engine built with each distribution's own compiler and C library,
  # and the network tests run there.
  distros:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: 'archlinux:latest', setup: 'pacman -Syu --noconfirm gcc make nodejs' }
          - { image: 'fedora:latest',    setup: 'dnf install -y gcc make nodejs' }
          - { image: 'debian:stable',    setup: 'apt-get update -qq && apt-get install -y gcc make nodejs ca-certificates' }
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Tools (${{ matrix.image }})
        run: ${{ matrix.setup }}
      - name: Build and test the engine
        run: |
          node --version
          node scripts/build-core.js
          cd core && make test
      - name: Network tests
        run: node tests/net/run.js

  # The real app, end to end (tests/e2e): started into the tray, its window
  # opened, left idle, sent to the tray, protection on, logoff (Windows), quit;
  # and what each of those states costs in memory on this OS.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Display and libraries for Electron (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb dbus-x11 libnss3 libgbm1 libasound2t64 libgtk-3-0t64

      - name: Install, build the engine and the interface
        run: |
          npm ci
          node scripts/build-core.js
          npm run build

      - name: End-to-end
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then dbus-run-session -- xvfb-run -a node tests/e2e/app.test.js
          else node tests/e2e/app.test.js; fi

      # Real browsers and the system's own HTTP clients, through the PAC that
      # Shroudly puts in this machine's proxy setting.
      - name: Browsers through the system proxy
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get install -y -qq dconf-cli dconf-gsettings-backend gsettings-desktop-schemas >/dev/null
            dbus-run-session -- node tests/e2e/browsers.test.js
          else node tests/e2e/browsers.test.js; fi

      - name: Baseline for comparison (${{ inputs.baseline_ref }})
        if: inputs.baseline_ref != ''
        shell: bash
        run: |
          git fetch --depth=1 origin "refs/tags/${{ inputs.baseline_ref }}:refs/tags/${{ inputs.baseline_ref }}" || git fetch --depth=1 origin "${{ inputs.baseline_ref }}"
          git worktree add "$RUNNER_TEMP/baseline" "${{ inputs.baseline_ref }}"
          (cd "$RUNNER_TEMP/baseline" && npm ci && node scripts/build-core.js && npm run build)
          export SHROUDLY_APP_DIR="$RUNNER_TEMP/baseline"
          if [ "$RUNNER_OS" = Linux ]; then dbus-run-session -- xvfb-run -a node tests/e2e/app.test.js
          else node tests/e2e/app.test.js; fi

      - name: Screenshots and memory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.os }}
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
