name: Build & Release

# Push a tag like v2.3.0 to build every platform on its own native runner and
# publish a GitHub release. Windows installers are code-signed through SignPath
# when signing is enabled (repository variable ENABLE_SIGNPATH = true and the
# SIGNPATH_* secrets/vars are set); otherwise they ship unsigned, exactly as the
# local builds do today.

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # zig cross-compiles the C engine for every OS/arch (scripts find `zig`
      # on PATH first). Same toolchain family used for local builds.
      - name: Install zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        # libnetfilter-queue/libmnl: the advanced engine. rpm: rpmbuild, for the
        # .rpm. libarchive-tools: bsdtar, which fpm shells out to for the
        # .pacman and which the runner image does not carry.
        run: sudo apt-get update && sudo apt-get install -y libnetfilter-queue-dev libmnl-dev rpm libarchive-tools xz-utils

      - name: Install dependencies
        run: npm ci

      - name: Build engine (all arches)
        run: node scripts/build-core.js --cross

      - name: Build advanced engine + fetch WinDivert (Windows)
        if: matrix.platform == 'win'
        run: |
          node scripts/build-core-advanced.js
          npm run fetch:windivert

      - name: Build advanced engine (Linux x64 native, arm64 best-effort)
        if: matrix.platform == 'linux'
        run: |
          node scripts/build-core-advanced.js || true
          bash scripts/ci-linux-arm64-advanced.sh || echo "arm64 advanced skipped"

      - name: Build web UI
        run: npm run build

      - name: Package (Windows)
        if: matrix.platform == 'win'
        run: npx electron-builder --win --publish never

      - name: Package (macOS)
        if: matrix.platform == 'mac'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --publish never

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux --publish never   # targets/arches from package.json

      # --- Windows code signing via SignPath (off unless enabled) -------------
      - name: Submit signing request (SignPath)
        if: matrix.platform == 'win' && vars.ENABLE_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v1.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: shroudly
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_SLUG }}
          github-artifact-id: ''                     # signs the files staged below
          wait-for-completion: true
          output-artifact-directory: dist
          parameters: |
            version: ${{ github.ref_name }}

      - name: Recompute Windows update metadata after signing
        if: matrix.platform == 'win' && vars.ENABLE_SIGNPATH == 'true'
        run: node scripts/recompute-win-latest.js

      - name: Collect artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          retention-days: 3
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.pacman
            dist/*.rpm
            dist/latest*.yml

  # ── Install what was built, on the systems it is for, before anything is
  # published. A package that does not install, misses a library or whose
  # engine does not start stops the release here.
  linux-packages:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: 'archlinux:latest', pkg: 'dist/*.pacman' }
          - { image: 'fedora:latest',    pkg: 'dist/*.rpm' }
          - { image: 'opensuse/tumbleweed', pkg: 'dist/*.rpm' }
          - { image: 'debian:stable',    pkg: 'dist/*.deb' }
          - { image: 'ubuntu:24.04',     pkg: 'dist/*.deb' }
          - { image: 'ubuntu:22.04',     pkg: 'dist/*.deb' }
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-linux
          path: dist
      - name: Install and check (${{ matrix.image }})
        run: sh scripts/ci-linux-package-test.sh "${{ matrix.pkg }}"

  appimage:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    file: x86_64, core: linux-x64 }
          - { os: ubuntu-24.04-arm, file: arm64,  core: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-linux
          path: dist
      - name: Extract and check the ${{ matrix.file }} AppImage
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          f=$(ls *-Linux-${{ matrix.file }}.AppImage)
          chmod +x "$f"
          ./"$f" --appimage-extract >/dev/null
          test -x squashfs-root/shroudly
          eng=squashfs-root/resources/app.asar.unpacked/electron/tools/core/${{ matrix.core }}/shroudly-core
          if ldd "$eng" | grep 'not found'; then exit 1; fi
          out=$( (sleep 2; echo STOP) | "$eng" --listen 127.0.0.1 --port 18765 --strategy 'split(sni)' 2>&1 | head -n 1 )
          echo "$out" | grep -q '"ready"'
          echo "ok  $f: app present, engine starts ($out)"

  windows-install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, arch: x64 }
          - { os: windows-11-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: dist-win
          path: dist
      - name: Install, run, uninstall (${{ matrix.arch }})
        run: node scripts/ci-windows-install-test.js ${{ matrix.arch }}

  macos-dmg:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   arch: arm64, lipo: arm64 }
          - { os: macos-15-intel, arch: x64,   lipo: x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-mac
          path: dist
      - name: Open the ${{ matrix.arch }} disk image and check the app
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(ls dist/*-macOS-${{ matrix.arch }}.dmg)
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" >/dev/null
          app="$mnt/Shroudly.app"
          test -d "$app"
          lipo -archs "$app/Contents/MacOS/Shroudly" | grep -q ${{ matrix.lipo }}
          eng="$app/Contents/Resources/app.asar.unpacked/electron/tools/core/darwin-${{ matrix.arch }}/shroudly-core"
          lipo -archs "$eng" | grep -q ${{ matrix.lipo }}
          out=$( (sleep 2; echo STOP) | "$eng" --listen 127.0.0.1 --port 18765 --strategy 'split(sni)' 2>&1 | head -n 1 )
          echo "$out" | grep -q '"ready"'
          hdiutil detach "$mnt" >/dev/null
          echo "ok  $dmg: ${{ matrix.lipo }} app and engine, engine starts"

  release:
    needs: [build, linux-packages, appimage, windows-install, macos-dmg]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all
      - name: Flatten into dist/
        run: |
          mkdir -p dist
          find dist-all -type f -exec cp -n {} dist/ \;
          ls -la dist
      - name: Publish GitHub release
        env:
          # The workflow's built-in token publishes as github-actions[bot], which
          # puts a bot's name on the release instead of the maintainer's. Use the
          # maintainer's own token when it is configured, and fall back only so a
          # fork without the secret can still build.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/publish-release.js
