name: Build & Release

# Push a tag like v2.3.0 to build every platform on its own native runner and
# publish a GitHub release. Windows installers are code-signed through SignPath
# when signing is enabled (repository variables ENABLE_SIGNPATH = true,
# SIGNPATH_ORGANIZATION_ID and SIGNPATH_POLICY_SLUG, secret SIGNPATH_API_TOKEN);
# otherwise they ship unsigned, exactly as the local builds do today.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      signing_policy:
        description: 'SignPath policy for this run (test-signing to try signing; a manual run never publishes)'
        type: choice
        options: [none, test-signing, release-signing]
        default: none

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # zig cross-compiles the C engine for every OS/arch (scripts find `zig`
      # on PATH first). Same toolchain family used for local builds.
      - name: Install zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        # rpm: rpmbuild, for the .rpm. libarchive-tools: bsdtar, which fpm shells out to for the
        # .pacman and which the runner image does not carry.
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools xz-utils

      - name: Install dependencies
        run: npm ci

      - name: Build engine (all arches)
        run: node scripts/build-core.js --cross

      - name: Build advanced engine + fetch WinDivert (Windows)
        if: matrix.platform == 'win'
        run: |
          node scripts/build-core-advanced.js
          npm run fetch:windivert

      - name: Build advanced engine (Linux x64 and arm64, against glibc 2.28)
        if: matrix.platform == 'linux'
        run: |
          bash scripts/ci-linux-advanced.sh amd64
          bash scripts/ci-linux-advanced.sh arm64
          bash scripts/ci-check-glibc.sh

      - name: Build web UI
        run: npm run build

      - name: Package (Windows)
        if: matrix.platform == 'win'
        run: npx electron-builder --win --publish never

      - name: Package (macOS)
        if: matrix.platform == 'mac'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --publish never

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux --publish never   # targets/arches from package.json

      - name: Collect artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.platform }}
          retention-days: 3
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.pacman
            dist/*.rpm
            dist/latest*.yml

  # ── Windows code signing via SignPath (off unless enabled) ───────────────
  # A job of its own, after the build: a release-signing request waits for
  # the maintainer to approve it in SignPath (required for SignPath
  # Foundation certificates), which can take a while, and must neither hold
  # the build up nor fail it by running out of time. The unsigned installers
  # go up as a GitHub artifact, SignPath signs them (the project's default
  # artifact configuration: a zip of Shroudly-*-Windows-*-Setup.exe,
  # Authenticode, product name and version enforced) and hands them back;
  # latest.yml is rewritten for the signed bytes so auto-update still
  # verifies, and dist-win is replaced by the signed set, which is what the
  # install test and the release then use. A manual run can pick
  # test-signing to try the whole path without publishing: only a tag
  # publishes.
  sign-windows:
    needs: build
    if: ${{ (inputs.signing_policy && inputs.signing_policy != 'none') || vars.ENABLE_SIGNPATH == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      # A manual run's choice, else release-signing once ENABLE_SIGNPATH is on.
      SIGN_POLICY: ${{ (inputs.signing_policy != 'none' && inputs.signing_policy) || (vars.ENABLE_SIGNPATH == 'true' && vars.SIGNPATH_POLICY_SLUG) || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8
        with:
          name: dist-win
          path: dist

      - name: Stage the Windows installers for signing
        id: unsigned
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-win
          retention-days: 1
          if-no-files-found: error
          # The two published installers; the universal one electron-builder
          # also makes is never published (scripts/publish-release.js).
          path: dist/Shroudly-*-Windows-*-Setup.exe

      # The artifact configuration enforces the installers' product name and
      # version (SignPath Foundation terms): the version comes from here.
      - name: Version for the signing request
        id: appver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Sign the Windows installers (SignPath)
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: Shroudly
          signing-policy-slug: ${{ env.SIGN_POLICY }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # A release-signing request waits for a person to approve it in
          # SignPath: up to almost six hours, the most a job may run.
          wait-for-completion-timeout-in-seconds: 21000
          output-artifact-directory: dist/signed
          parameters: |
            version: "${{ steps.appver.outputs.version }}"

      - name: Put the signed installers in place
        shell: pwsh
        run: |
          $signed = @(Get-ChildItem dist/signed -Recurse -File -Filter '*-Setup.exe')
          $built = @(Get-ChildItem dist -File -Filter 'Shroudly-*-Windows-*-Setup.exe')
          if ($signed.Count -ne $built.Count -or $built.Count -eq 0) { throw "expected $($built.Count) signed installers, got $($signed.Count)" }
          foreach ($f in $signed) {
            $sig = Get-AuthenticodeSignature $f.FullName
            if (-not $sig.SignerCertificate) { throw "$($f.Name) came back without a signature" }
            # The test certificate is not trusted by Windows; the release one is.
            if ($env:SIGN_POLICY -eq 'release-signing' -and $sig.Status -ne 'Valid') { throw "$($f.Name): signature $($sig.Status)" }
            "$($f.Name): $($sig.SignerCertificate.Subject) [$($sig.Status)]"
            Move-Item $f.FullName (Join-Path dist $f.Name) -Force
          }
          Remove-Item dist/signed -Recurse -Force

      - name: Recompute Windows update metadata after signing
        run: node scripts/recompute-win-latest.js

      - name: Replace the Windows artifacts with the signed ones
        uses: actions/upload-artifact@v7
        with:
          name: dist-win
          overwrite: true
          retention-days: 3
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/latest*.yml

  # ── Install what was built, on the systems it is for, before anything is
  # published. A package that does not install, misses a library or whose
  # engine does not start stops the release here.
  linux-packages:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: 'archlinux:latest', pkg: 'dist/*.pacman' }
          - { image: 'fedora:latest',    pkg: 'dist/*.rpm' }
          - { image: 'opensuse/tumbleweed', pkg: 'dist/*.rpm' }
          - { image: 'debian:stable',    pkg: 'dist/*.deb' }
          - { image: 'ubuntu:24.04',     pkg: 'dist/*.deb' }
          - { image: 'ubuntu:22.04',     pkg: 'dist/*.deb' }
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist-linux
          path: dist
      - name: Install and check (${{ matrix.image }})
        run: sh scripts/ci-linux-package-test.sh "${{ matrix.pkg }}"

  appimage:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    file: x86_64, core: linux-x64 }
          - { os: ubuntu-24.04-arm, file: arm64,  core: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-linux
          path: dist
      - name: Extract and check the ${{ matrix.file }} AppImage
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          f=$(ls *-Linux-${{ matrix.file }}.AppImage)
          chmod +x "$f"
          ./"$f" --appimage-extract >/dev/null
          test -x squashfs-root/shroudly
          eng=squashfs-root/resources/app.asar.unpacked/electron/tools/core/${{ matrix.core }}/shroudly-core
          if ldd "$eng" | grep 'not found'; then exit 1; fi
          out=$( (sleep 2; echo STOP) | "$eng" --listen 127.0.0.1 --port 18765 --strategy 'split(sni)' 2>&1 | head -n 1 )
          echo "$out" | grep -q '"ready"'
          echo "ok  $f: app present, engine starts ($out)"

  windows-install:
    # The signed installers when signing is on; the build's otherwise.
    needs: [build, sign-windows]
    if: ${{ !cancelled() && !failure() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, arch: x64 }
          - { os: windows-11-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8
        with:
          name: dist-win
          path: dist
      - name: Install, run, uninstall (${{ matrix.arch }})
        run: node scripts/ci-windows-install-test.js ${{ matrix.arch }}

  macos-dmg:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   arch: arm64, lipo: arm64 }
          - { os: macos-15-intel, arch: x64,   lipo: x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-mac
          path: dist
      - name: Open the ${{ matrix.arch }} disk image and check the app
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(ls dist/*-macOS-${{ matrix.arch }}.dmg)
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" >/dev/null
          app="$mnt/Shroudly.app"
          test -d "$app"
          lipo -archs "$app/Contents/MacOS/Shroudly" | grep -q ${{ matrix.lipo }}
          eng="$app/Contents/Resources/app.asar.unpacked/electron/tools/core/darwin-${{ matrix.arch }}/shroudly-core"
          lipo -archs "$eng" | grep -q ${{ matrix.lipo }}
          out=$( (sleep 2; echo STOP) | "$eng" --listen 127.0.0.1 --port 18765 --strategy 'split(sni)' 2>&1 | head -n 1 )
          echo "$out" | grep -q '"ready"'
          hdiutil detach "$mnt" >/dev/null
          echo "ok  $dmg: ${{ matrix.lipo }} app and engine, engine starts"

  # The Android app, signed with the project's key (secrets ANDROID_*). The
  # signature is checked against the key's certificate before it is handed
  # on; without the secrets nothing is published for Android and the desktop
  # release goes ahead. Beside it, the same version as an app bundle for
  # Google Play (STORE_BUILD: no GitHub update check), signed with the upload
  # key (secrets ANDROID_UPLOAD_*; the app signing key when those are not
  # set). The bundle is kept as a workflow artifact for 90 days, never put on
  # the release (android/PLAY_STORE.md). Both pass the 16 KB page size check.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NDK_VERSION: 28.2.13676358
      # SHA-256 of the signing certificate (android/README.md).
      CERT_SHA256: 23ac014b7226343b74c7c9c0a4fd6f1ded97518a3bfd35bcde65b6c1eca8bd76
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Gradle wrapper is the one published by Gradle
        run: echo "7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d  android/gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION" >/dev/null
      - name: hev source, generated files
        run: |
          node android/scripts/fetch-hev.js
          node android/scripts/gen-strings.js --check
          node android/scripts/gen-block-ips.js --check
          node android/scripts/gen-raw-apps.js --check
          node android/scripts/gen-donate.js --check
      - name: Signed release build (APK) and Play bundle (AAB)
        id: apk
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then echo "::warning::No Android signing key configured: no APK in this release"; exit 0; fi
          ks="$RUNNER_TEMP/release.jks"
          uks="$RUNNER_TEMP/upload.jks"
          trap 'rm -f "$ks" "$uks"' EXIT
          echo "$KEYSTORE_B64" | base64 -d > "$ks"
          ver=$(node -p "require('./package.json').version")

          # The APK on GitHub: the app signing key, GitHub update check.
          (cd android && ANDROID_KEYSTORE="$ks" ./gradlew --no-daemon testDebugUnitTest assembleRelease)
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Shroudly-$ver-Android.apk"
          bt="$ANDROID_HOME/build-tools/36.0.0"
          "$bt/apksigner" verify --print-certs "dist/Shroudly-$ver-Android.apk" | tee "$RUNNER_TEMP/certs.txt"
          grep -qi "Signer #1 certificate SHA-256 digest: $CERT_SHA256" "$RUNNER_TEMP/certs.txt"

          # The bundle for Google Play: same version and version code, no
          # GitHub update check, the upload key. Play re-signs what it
          # delivers with the app signing key above.
          if [ -n "$UPLOAD_KEYSTORE_B64" ]; then
            echo "$UPLOAD_KEYSTORE_B64" | base64 -d > "$uks"
          else
            echo "::warning::No upload key (ANDROID_UPLOAD_*): the Play bundle is signed with the app signing key"
            cp "$ks" "$uks"
            ANDROID_UPLOAD_KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
            ANDROID_UPLOAD_KEY_ALIAS="$ANDROID_KEY_ALIAS"
            ANDROID_UPLOAD_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
          fi
          (cd android && ANDROID_UPLOAD_KEYSTORE="$uks" ./gradlew --no-daemon -Pshroudly.store=play bundleRelease)
          mkdir -p play
          cp android/app/build/outputs/bundle/release/app-release.aab "play/Shroudly-$ver.aab"
          # Signed, and by which key (jarsigner's many warnings about the
          # bundle's layout are kept out of the log).
          jarsigner -verify "play/Shroudly-$ver.aab" > "$RUNNER_TEMP/aab.txt" 2>&1 || true
          grep -q "jar verified" "$RUNNER_TEMP/aab.txt" || { tail -5 "$RUNNER_TEMP/aab.txt"; exit 1; }
          keytool -printcert -jarfile "play/Shroudly-$ver.aab" | grep -i "SHA256:" | sed 's/^/Bundle signed by upload key /'
          echo "built=1" >> "$GITHUB_OUTPUT"
      - name: 16 KB page size (APK, and the APKs Play makes from the bundle)
        if: steps.apk.outputs.built == '1'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          bash android/scripts/check-16k.sh dist/*-Android.apk play/*.aab
      - uses: actions/upload-artifact@v7
        if: steps.apk.outputs.built == '1'
        with:
          name: dist-android
          path: dist/*-Android.apk
          retention-days: 1
          if-no-files-found: error
      # For a Google Play upload by hand: not a dist-* set, so never on the release.
      - uses: actions/upload-artifact@v7
        if: steps.apk.outputs.built == '1'
        with:
          name: play-bundle
          path: play/*.aab
          retention-days: 90
          if-no-files-found: error

  release:
    needs: [build, sign-windows, linux-packages, appimage, windows-install, macos-dmg, android]
    runs-on: ubuntu-latest
    # sign-windows is skipped while signing is off; anything failed stops it.
    if: ${{ startsWith(github.ref, 'refs/tags/') && !cancelled() && !failure() }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # The dist-* sets only: never the unsigned copies staged for SignPath.
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist-all
      - name: Flatten into dist/
        run: |
          mkdir -p dist
          find dist-all -type f -exec cp -n {} dist/ \;
          ls -la dist
      - name: Publish GitHub release
        env:
          # The workflow's built-in token publishes as github-actions[bot], which
          # puts a bot's name on the release instead of the maintainer's. Use the
          # maintainer's own token when it is configured, and fall back only so a
          # fork without the secret can still build.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/publish-release.js
