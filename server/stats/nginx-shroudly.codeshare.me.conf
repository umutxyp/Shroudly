# nginx site for shroudly.codeshare.me, reached through the Cloudflare tunnel
# (cloudflared sends every hostname to nginx on :80). No access log: the
# counter must never record anything about the people it counts.
server {
    listen 80;
    listen [::]:80;
    server_name shroudly.codeshare.me;

    if ($from_cloudflare = 0) {
        return 403;
    }

    access_log off;
    error_log /var/log/nginx/shroudly.error.log warn;
    client_max_body_size 1k;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 20s;
    }
}
